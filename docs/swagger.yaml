info:
  contact: {}
  description: API sistem manajemen toko emas dengan PostgreSQL backend.
  title: Toko Emas API
  version: "1.0"
paths:
  /api/v1/baki:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: List semua baki
      tags:
      - Baki
    post:
      consumes:
      - application/json
      parameters:
      - description: Data baki
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateBakiRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Tambah baki
      tags:
      - Baki
  /api/v1/baki/{id}:
    delete:
      parameters:
      - description: Baki ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Hapus baki
      tags:
      - Baki
    get:
      parameters:
      - description: Baki ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Get baki by ID
      tags:
      - Baki
    put:
      consumes:
      - application/json
      parameters:
      - description: Baki ID
        in: path
        name: id
        required: true
        type: string
      - description: Data baki
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateBakiRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Update baki
      tags:
      - Baki
  /api/v1/barang:
    get:
      consumes:
      - application/json
      description: Mendapatkan semua data barang
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: List semua barang
      tags:
      - Barang
    post:
      consumes:
      - application/json
      description: Menambahkan barang baru
      parameters:
      - description: Data barang
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateBarangRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Tambah barang
      tags:
      - Barang
  /api/v1/barang-landing:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: List semua barang landing page
      tags:
      - Barang Landing
    post:
      consumes:
      - application/json
      parameters:
      - description: Data barang landing
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateBarangLandingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Tambah barang landing
      tags:
      - Barang Landing
  /api/v1/barang-landing/{id}:
    delete:
      parameters:
      - description: Barang Landing ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Hapus barang landing
      tags:
      - Barang Landing
    get:
      parameters:
      - description: Barang Landing ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Get barang landing by ID
      tags:
      - Barang Landing
    put:
      consumes:
      - application/json
      parameters:
      - description: Barang Landing ID
        in: path
        name: id
        required: true
        type: string
      - description: Data barang landing
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateBarangLandingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
