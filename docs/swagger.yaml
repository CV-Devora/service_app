      tags:
      - Barang Landing
  /api/v1/barang/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus barang (soft delete)
      parameters:
      - description: Barang ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Hapus barang
      tags:
      - Barang
    get:
      consumes:
      - application/json
      description: Mendapatkan detail barang berdasarkan ID
      parameters:
      - description: Barang ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Get barang by ID
      tags:
      - Barang
    put:
      consumes:
      - application/json
      description: Memperbarui data barang berdasarkan ID
      parameters:
      - description: Barang ID
        in: path
        name: id
        required: true
        type: string
      - description: Data barang
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateBarangRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Update barang
      tags:
      - Barang
  /api/v1/barang/export:
    get:
      description: Mengunduh data barang inventaris (yang belum terjual) sebagai file
        .xlsx
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Export barang ke Excel
      tags:
      - Barang
  /api/v1/barang/import:
    post:
      consumes:
      - multipart/form-data
      description: Import data barang massal dari file .xlsx atau .csv dengan kolom
        barcode, baki, nama, kadar, berat, harga jual, kondisi. Khusus admin.
      parameters:
      - description: File Excel (.xlsx) atau CSV
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ImportBarangResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Import barang dari file Excel/CSV
      tags:
      - Barang
  /api/v1/barang/latest-barcode:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: Get latest barcode number
      tags:
